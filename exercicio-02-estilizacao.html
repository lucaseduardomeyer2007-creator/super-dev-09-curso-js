<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/exercicio-02-estilizacao.css">
</head>

<body>

    <h1>Destaque de produto</h1>

    <div class="caixa-01" id="caixa-01">Produto</div>

    <button onclick="caixaCorAzul()" class="botoes-cores">Cor azul</button>
    <button onclick="caixaCorVermelha()" class="botoes-cores">Cor vermelha</button>
    <button onclick="caixaCorVerde()" class="botoes-cores">Cor verde</button>
    <button onclick="aumentarCaixa()" class="botoes-cores">Aumentar o tamanho da caixa</button>
    <button onclick="tamanhoNormal()" class="botoes-cores">Redefenir</button>
    <hr>

    <h1>Perfil de Usuário</h1>

    

    <div class="nome-01" id="nome1">
        <label for="nome1">Nome</label>
        <input type="text" id="nome-01">
    </div>

    <select name="tema" class="temas">
        <option selected disabled>Selecione um tema</option>
        <option value="tema1" id="tema1">Tema 1</option>
        <option value="tema2" onselect="temaEscuro()" id="tema2">Tema 2</option>
        <option value="tema3" id="tema3">Tema 3</option>
    </select>

    <div class="modo-destaque">
        <label for="destaque">Destaque</label>
        <input type="checkbox" id="destaque">
    </div>

    <button onclick="aplicarAlteracao()">Aplicar alterações</button>
    <span>
        <div class="card-01">
            <img src="https://img.magnific.com/vetores-premium/icone-de-circulo-de-usuario-anonimo-estilo-simples-de-ilustracao-vetorial-com-sombra-longa_520826-1931.jpg" class="imagem1">
            <textarea disabled readonly class="apresentar-nomes"></textarea>

        </div>

    </span>





    <script src="assets/js/exercicio-02-estilizacao.js"></script>
</body>

</html>
